<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9400D3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#bg)" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Palette icon -->
  <g transform="translate(50,50)">
    <!-- Main palette shape -->
    <ellipse cx="-5" cy="-8" rx="18" ry="12" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Color dots -->
    <circle cx="-15" cy="-12" r="3" fill="#FF0000"/>
    <circle cx="-8" cy="-16" r="3" fill="#00FF00"/>
    <circle cx="0" cy="-15" r="3" fill="#0000FF"/>
    <circle cx="8" cy="-12" r="3" fill="#FFFF00"/>
    <circle cx="13" cy="-6" r="3" fill="#FF69B4"/>
    
    <!-- Brush handle -->
    <rect x="12" y="0" width="3" height="15" fill="#8B4513" rx="1.5"/>
    <ellipse cx="13.5" cy="15" rx="2" ry="3" fill="#C0C0C0"/>
  </g>
</svg>
